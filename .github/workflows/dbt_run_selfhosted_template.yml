name: dbt_run_selfhosted_template

on:
  workflow_call:
    inputs:
      dbt_command:
        type: string
        description: 'dbt commands to run'
        required: true
      environment:
        type: string
        description: 'github environment to get configuration values'
        required: false
        default: 'workflow_prod'
      runner:
        type: string
        description: 'self-hosted runner label'
        required: false
        default: 'data-platform-prod'
      timeout_minutes:
        type: number
        description: 'timeout for the dbt job in minutes'
        required: false
        default: 90
      container_image:
        type: string
        description: 'container image for self-hosted runner'
        required: false
        default: '924682671219.dkr.ecr.us-east-1.amazonaws.com/data-platform-eks-prod/ci-runner:latest'
      warehouse:
        type: string
        description: 'override warehouse (defaults to vars.WAREHOUSE)'
        required: false
        default: ''
    secrets:
      GH_INTERNAL_TOKEN:
        required: true
      SLACK_WEBHOOK_URL:
        required: false
      PASSWORD:
        required: false
      PRIVATE_KEY:
        required: false

env:
  DBT_PROFILES_DIR: ${{ vars.DBT_PROFILES_DIR }}
  ACCOUNT: "${{ vars.ACCOUNT }}"
  ROLE: "${{ vars.ROLE }}"
  USER: "${{ vars.USER }}"
  PASSWORD: "${{ secrets.PASSWORD }}"
  PRIVATE_KEY: "${{ secrets.PRIVATE_KEY }}"
  REGION: "${{ vars.REGION }}"
  DATABASE: "${{ vars.DATABASE }}"
  WAREHOUSE: "${{ inputs.warehouse || vars.WAREHOUSE }}"
  SLACK_WEBHOOK_URL: "${{ secrets.SLACK_WEBHOOK_URL }}"
  SCHEMA: "${{ vars.SCHEMA }}"

jobs:
  run_dbt_jobs:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    container:
      image: ${{ inputs.container_image }}
    environment:
      name: ${{ inputs.environment }}
    outputs:
      started: ${{ steps.mark-started.outputs.started }}

    steps:
      - name: Mark job as started
        id: mark-started
        run: echo "started=true" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v6

      - name: Configure git for internal repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_INTERNAL_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: install dependencies
        run: |
          pip install -r requirements.txt
          dbt deps

      - name: Run DBT Jobs
        run: |
          ${{ inputs.dbt_command }}

  run_dbt_jobs_fallback:
    needs: [run_dbt_jobs]
    if: failure() && needs.run_dbt_jobs.outputs.started != 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Configure git for internal repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_INTERNAL_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: install dependencies
        run: |
          pip install -r requirements.txt
          dbt deps

      - name: Run DBT Jobs
        run: |
          ${{ inputs.dbt_command }}
